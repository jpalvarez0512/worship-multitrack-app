<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letras OBS Studio | Worship Multitrack</title>
  <style>
    :root {
      --lyric-color: #FFE600;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Fondo 100% transparente siempre para Fuente de Navegador en OBS Studio */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .obs-stage {
      width: 100vw;
      height: 100vh;
      padding: 4vh 6vw 6.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Tercio inferior (Lower-Thirds) por defecto para transmisión */
      text-align: center;
    }

    body.center-mode .obs-stage {
      justify-content: center;
      padding-bottom: 4vh;
    }

    .obs-lyric-box {
      max-width: 88vw;
      padding: 14px 28px;
      border-radius: 14px;
      transition: opacity 90ms ease, transform 90ms ease;
    }

    /* Banda semitransparente opcional (?box=1) */
    body.box-mode .obs-lyric-box.has-text {
      background: rgba(8, 12, 24, 0.72);
      border-left: 5px solid var(--lyric-color);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    .obs-lyric-text {
      color: var(--lyric-color);
      font-size: clamp(2.1rem, 3.6vw, 3.5rem);
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -0.01em;
      /* Trazo negro limpio detrás de la letra + sombra de transmisión */
      paint-order: stroke fill;
      -webkit-text-stroke: 3px rgba(0, 0, 0, 0.96);
      text-shadow:
        0 3px 6px rgba(0, 0, 0, 0.95),
        0 6px 18px rgba(0, 0, 0, 0.85);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .obs-enter {
      animation: obsPop 85ms ease-out forwards;
    }
    @keyframes obsPop {
      from { opacity: 0.2; transform: translateY(4px); }
      to   { opacity: 1;   transform: translateY(0); }
    }

    /* Barra flotante solo visible si se pasa el mouse en un navegador normal (invisible en OBS) */
    .obs-helper-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 999;
    }
    body:hover .obs-helper-bar { opacity: 1; }
    .obs-helper-bar button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .obs-helper-bar button:hover { background: #2563eb; }
  </style>
</head>
<body>

  <div class="obs-helper-bar">
    <button onclick="document.body.classList.toggle('center-mode')">↕ Abajo / Centro</button>
    <button onclick="document.body.classList.toggle('box-mode')">▭ Franja Oscura</button>
  </div>

  <div class="obs-stage">
    <div class="obs-lyric-box" id="obs-box">
      <div class="obs-lyric-text" id="obs-lyric"></div>
    </div>
  </div>

  <script>
    // Parámetros opcionales por URL: /obs?pos=center o /obs?box=1
    const params = new URLSearchParams(location.search);
    if (params.get('pos') === 'center') document.body.classList.add('center-mode');
    if (params.get('box') === '1') document.body.classList.add('box-mode');

    let ws = null;
    let currentLyric = null;
    let isHiddenByOperator = false;

    const boxEl = document.getElementById('obs-box');
    const lyricEl = document.getElementById('obs-lyric');

    function renderObsLyric(rawText) {
      const clean = isHiddenByOperator ? '' : (rawText || '');
      if (clean === currentLyric) return;
      currentLyric = clean;
      lyricEl.textContent = clean;
      boxEl.classList.toggle('has-text', Boolean(clean));

      lyricEl.classList.remove('obs-enter');
      if (clean) {
        void lyricEl.offsetWidth;
        lyricEl.classList.add('obs-enter');
      }
    }

    function applyConfig(settings) {
      if (settings && settings.text_color) {
        document.documentElement.style.setProperty('--lyric-color', settings.text_color);
      }
    }

    async function initObs() {
      try {
        const res = await fetch('/api/projection/settings');
        if (res.ok) {
          const data = await res.json();
          applyConfig(data.settings);
          isHiddenByOperator = Boolean(data.blackout || data.clear);
        }
      } catch (e) {}
      connectWS();
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws/projection`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'projection_tick') {
            // En OBS: Blackout u Ocultar Texto limpian la letra pero mantienen el lienzo 100% transparente
            // para no tapar la cámara en vivo con un cuadro negro.
            isHiddenByOperator = Boolean(data.blackout || data.clear);
            renderObsLyric(data.lyric || '');
          } else if (data.type === 'projection_state') {
            isHiddenByOperator = Boolean(data.blackout || data.clear);
            if (isHiddenByOperator) renderObsLyric('');
          } else if (data.type === 'projection_config') {
            applyConfig(data.settings);
          }
        } catch (e) {}
      };

      ws.onclose = () => setTimeout(connectWS, 1200);
      ws.onerror = () => ws.close();
    }

    window.onload = initObs;
  </script>
</body>
</html>
