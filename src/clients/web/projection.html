<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Proyección | Worship Multitrack</title>
  <meta name="theme-color" content="#040711">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Worship Proyección">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <style>
    :root {
      --lyric-color: #FFE600;
      --dim-opacity: 0.30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #040711;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Capas de Fondo: Presets, Loops Animados, Imagen y Video Loop */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    /* Presets estáticos y animados */
    #bg-preset.theme-ocean {
      background: radial-gradient(circle at 50% 25%, #1e3a8a 0%, #0f172a 55%, #020617 100%);
    }
    #bg-preset.theme-worship-purple {
      background: radial-gradient(circle at 50% 20%, #581c87 0%, #2e1065 50%, #090418 100%);
    }
    #bg-preset.theme-warm-gold {
      background: radial-gradient(circle at 50% 20%, #78350f 0%, #3b1706 52%, #0c0603 100%);
    }
    #bg-preset.theme-emerald {
      background: radial-gradient(circle at 50% 25%, #065f46 0%, #062c24 55%, #020d0b 100%);
    }
    #bg-preset.theme-black {
      background: #000000;
    }

    /* Loop Animado Integrado: Aurora Celestial */
    #bg-preset.theme-loop-aurora {
      background: #050816;
      overflow: hidden;
    }
    #bg-preset.theme-loop-aurora::before,
    #bg-preset.theme-loop-aurora::after {
      content: "";
      position: absolute;
      inset: -35%;
      background:
        radial-gradient(ellipse at 30% 35%, rgba(37, 99, 235, 0.55) 0%, transparent 52%),
        radial-gradient(ellipse at 72% 30%, rgba(147, 51, 234, 0.48) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 75%, rgba(14, 165, 233, 0.38) 0%, transparent 55%);
      filter: blur(42px);
      animation: auroraDrift 18s ease-in-out infinite alternate;
    }
    #bg-preset.theme-loop-aurora::after {
      animation-duration: 25s;
      animation-direction: alternate-reverse;
      opacity: 0.75;
    }
    @keyframes auroraDrift {
      0% { transform: translate3d(-4%, -3%, 0) scale(1.02) rotate(-2deg); }
      50% { transform: translate3d(4%, 3%, 0) scale(1.10) rotate(2deg); }
      100% { transform: translate3d(-2%, 5%, 0) scale(1.04) rotate(-1deg); }
    }

    /* Loop Animado Integrado: Destellos Dorados */
    #bg-preset.theme-loop-particles {
      background: radial-gradient(circle at 50% 30%, #271709 0%, #0e0906 60%, #040302 100%);
    }

    #particles-canvas {
      z-index: 2;
      display: none;
    }

    /* Imagen personalizada */
    #bg-image {
      z-index: 3;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
    }
    #bg-image.visible { opacity: 1; }

    /* Video Loop personalizado (.mp4, .webm, .mov) */
    #bg-video {
      z-index: 4;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
    }
    #bg-video.visible { opacity: 1; }

    /* Capa de oscurecimiento para contraste sobre videos/fotos */
    #bg-dimmer {
      z-index: 5;
      background: #000000;
      opacity: var(--dim-opacity);
      transition: opacity 0.25s ease;
    }

    /* Escenario Central de Letras */
    .projection-stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      padding: 4vh 6vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .lyric-display {
      color: var(--lyric-color);
      font-size: clamp(2.8rem, 5.6vw, 5.4rem);
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -0.01em;
      max-width: 90vw;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Borde oscuro detrás del relleno amarillo + sombra profunda multicapa */
      paint-order: stroke fill;
      -webkit-text-stroke: 3.2px rgba(0, 0, 0, 0.95);
      text-shadow:
        0 3px 6px rgba(0, 0, 0, 0.95),
        0 8px 24px rgba(0, 0, 0, 0.90),
        0 0 42px rgba(0, 0, 0, 0.78);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .lyric-enter {
      animation: lyricPop 95ms cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes lyricPop {
      from { opacity: 0.25; transform: translateY(5px) scale(0.992); }
      to   { opacity: 1;    transform: translateY(0) scale(1); }
    }

    /* Modo Lower-Thirds opcional en proyector */
    body.lower-thirds .projection-stage {
      justify-content: flex-end;
      padding-bottom: 7vh;
    }
    body.lower-thirds .lyric-display {
      font-size: clamp(2.1rem, 3.8vw, 3.6rem);
      min-height: 1.6em;
    }

    /* Pantalla Negra Total (Blackout de Proyector) */
    #blackout-curtain {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    body.blackout-active #blackout-curtain {
      opacity: 1;
    }

    /* Barra flotante discreta al mover el mouse sobre el proyector */
    .controls-toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 900;
    }
    body:hover .controls-toolbar { opacity: 1; }
    .controls-toolbar button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .controls-toolbar button:hover { background: #2563eb; }
  </style>
</head>
<body>

  <!-- Capas de Fondo -->
  <div id="bg-preset" class="bg-layer theme-loop-aurora"></div>
  <canvas id="particles-canvas" class="bg-layer"></canvas>
  <div id="bg-image" class="bg-layer"></div>
  <video id="bg-video" class="bg-layer" autoplay loop muted playsinline preload="auto"></video>
  <div id="bg-dimmer" class="bg-layer"></div>

  <!-- Escenario de Letras -->
  <div class="projection-stage" id="stage">
    <div class="lyric-display" id="lyric-text"></div>
  </div>

  <!-- Cortina Blackout -->
  <div id="blackout-curtain"></div>

  <!-- Controles rápidos locales -->
  <div class="controls-toolbar">
    <button onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
    <button onclick="document.body.classList.toggle('lower-thirds')">📺 Tercio Inferior</button>
  </div>

  <script>
    let ws = null;
    let currentLyric = null;
    let currentVideoUrl = "";
    let particlesAnimId = null;
    let particles = [];

    const presetEl = document.getElementById('bg-preset');
    const canvasEl = document.getElementById('particles-canvas');
    const imageEl  = document.getElementById('bg-image');
    const videoEl  = document.getElementById('bg-video');
    const lyricEl  = document.getElementById('lyric-text');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // --- Loop integrado de partículas doradas ---
    function startParticlesLoop() {
      if (particlesAnimId) return;
      canvasEl.style.display = 'block';
      const ctx = canvasEl.getContext('2d');
      const resize = () => {
        canvasEl.width = window.innerWidth;
        canvasEl.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);

      if (!particles.length) {
        for (let i = 0; i < 65; i++) {
          particles.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 2.8 + 0.8,
            vy: -(Math.random() * 0.45 + 0.12),
            vx: (Math.random() - 0.5) * 0.25,
            a: Math.random() * 0.65 + 0.2,
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < -10) { p.y = canvasEl.height + 10; p.x = Math.random() * canvasEl.width; }
          if (p.x < -10) p.x = canvasEl.width + 10;
          if (p.x > canvasEl.width + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(253, 224, 71, ${p.a})`;
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(251, 191, 36, 0.8)';
          ctx.fill();
        }
        particlesAnimId = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopParticlesLoop() {
      if (particlesAnimId) {
        cancelAnimationFrame(particlesAnimId);
        particlesAnimId = null;
      }
      canvasEl.style.display = 'none';
    }

    // --- Aplicar configuración de fondo, video loop, brillo y color ---
    function applyProjectionSettings(settings) {
      if (!settings) return;

      if (settings.text_color) {
        document.documentElement.style.setProperty('--lyric-color', settings.text_color);
      }
      if (typeof settings.dim_opacity === 'number') {
        document.documentElement.style.setProperty('--dim-opacity', settings.dim_opacity);
      }
      document.body.classList.toggle('lower-thirds', Boolean(settings.lower_thirds));

      const bg = settings.background || 'loop-aurora';

      if (bg.startsWith('custom:') && settings.background_url) {
        stopParticlesLoop();
        if (settings.background_is_video) {
          imageEl.classList.remove('visible');
          if (currentVideoUrl !== settings.background_url) {
            currentVideoUrl = settings.background_url;
            videoEl.src = settings.background_url;
            videoEl.load();
          }
          videoEl.classList.add('visible');
          videoEl.play().catch(() => {});
        } else {
          videoEl.classList.remove('visible');
          videoEl.pause();
          currentVideoUrl = "";
          imageEl.style.backgroundImage = `url("${settings.background_url}")`;
          imageEl.classList.add('visible');
        }
      } else {
        // Preset integrado (estático o loop animado)
        imageEl.classList.remove('visible');
        videoEl.classList.remove('visible');
        videoEl.pause();
        currentVideoUrl = "";

        presetEl.className = `bg-layer theme-${bg}`;
        if (bg === 'loop-particles') {
          startParticlesLoop();
        } else {
          stopParticlesLoop();
        }
      }
    }

    // Asegurar que los video loops nunca se queden pausados
    videoEl.addEventListener('ended', () => {
      videoEl.currentTime = 0;
      videoEl.play().catch(() => {});
    });

    function setBlackoutAndClear(blackout, clear) {
      document.body.classList.toggle('blackout-active', Boolean(blackout));
      if (clear) renderLyric('');
    }

    function renderLyric(newText) {
      const clean = newText || '';
      if (clean === currentLyric) return;
      currentLyric = clean;
      lyricEl.textContent = clean;
      lyricEl.classList.remove('lyric-enter');
      if (clean) {
        void lyricEl.offsetWidth; // Reiniciar animación GPU instantánea (sin retraso)
        lyricEl.classList.add('lyric-enter');
      }
    }

    function updateProjectionTick(data) {
      document.body.classList.toggle('blackout-active', Boolean(data.blackout));
      const nextText = (data.blackout || data.clear) ? '' : (data.lyric || '');
      renderLyric(nextText);
    }

    async function loadInitialSettings() {
      try {
        const res = await fetch('/api/projection/settings');
        if (!res.ok) return;
        const data = await res.json();
        applyProjectionSettings(data.settings);
        setBlackoutAndClear(data.blackout, data.clear);
      } catch (e) {}
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws/projection`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'projection_tick') {
            updateProjectionTick(data);
          } else if (data.type === 'projection_config') {
            applyProjectionSettings(data.settings);
          } else if (data.type === 'projection_state') {
            setBlackoutAndClear(data.blackout, data.clear);
          }
        } catch (e) {}
      };

      ws.onclose = () => setTimeout(connectWebSocket, 1200);
      ws.onerror = () => ws.close();
    }

    window.onload = () => {
      loadInitialSettings();
      connectWebSocket();
    };
  </script>
</body>
</html>
