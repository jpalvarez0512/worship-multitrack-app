<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Proyección & OBS | Worship Multitrack</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --highlight: #60a5fa;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: background-color 0.4s ease;
    }

    body.obs-mode {
      background-color: transparent !important;
    }

    /* Contenedor central de la letra para proyección */
    .projection-stage {
      max-width: 90vw;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .song-title-badge {
      font-size: 1.3rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .lyric-display {
      font-size: 4.2rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    }

    .section-indicator {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--highlight);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 30px;
      opacity: 0.6;
    }

    /* Modo Lower-Thirds para OBS / Streaming */
    body.lower-thirds .projection-stage {
      position: absolute;
      bottom: 40px;
      left: 5vw;
      right: 5vw;
      background: rgba(10, 15, 29, 0.88);
      border-radius: 16px;
      border-left: 6px solid #3b82f6;
      padding: 20px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
    }
    body.lower-thirds .lyric-display {
      font-size: 2.8rem;
      min-height: auto;
    }
    body.lower-thirds .song-title-badge { display: none; }

    /* Barra de herramientas flotante (se oculta tras inactividad) */
    .controls-toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      background: rgba(20, 24, 36, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }
    body:hover .controls-toolbar { opacity: 1; }

    button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }

    .fade-out {
      opacity: 0 !important;
      transform: translateY(6px);
    }
    .blackout-active {
      background-color: #000000 !important;
    }
    .blackout-active * {
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <div class="controls-toolbar">
    <button onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
    <button onclick="toggleLowerThirds()">📺 Lower-Thirds (OBS)</button>
    <button onclick="toggleObsMode()">🎨 Fondo Transparente</button>
  </div>

  <div class="projection-stage" id="stage">
    <div class="song-title-badge" id="song-title-display">Cuán Grande es Dios</div>
    <div class="lyric-display" id="lyric-text">Esperando inicio...</div>
    <div class="section-indicator" id="section-text">INTRO</div>
  </div>

  <script>
    let ws = null;
    let currentLyric = "";

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleLowerThirds() {
      document.body.classList.toggle('lower-thirds');
    }

    function toggleObsMode() {
      document.body.classList.toggle('obs-mode');
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws/projection`;
      ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'projection_tick') {
            updateProjection(data);
          } else if (data.type === 'projection_state') {
            applyBlackout(data.blackout, data.clear);
          } else if (data.type === 'song_changed') {
            document.getElementById('song-title-display').innerText = data.title;
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 1500);
      };
      ws.onerror = () => ws.close();
    }

    function applyBlackout(blackout, clear) {
      if (blackout) {
        document.body.classList.add('blackout-active');
      } else {
        document.body.classList.remove('blackout-active');
      }
      if (clear) {
        document.getElementById('lyric-text').innerText = '';
      }
    }

    function updateProjection(data) {
      if (data.blackout) {
        document.body.classList.add('blackout-active');
        return;
      } else {
        document.body.classList.remove('blackout-active');
      }

      const lyricEl = document.getElementById('lyric-text');
      const sectionEl = document.getElementById('section-text');

      sectionEl.innerText = data.sec || '';

      const newText = data.clear ? '' : (data.lyric || '');

      if (newText !== currentLyric) {
        lyricEl.classList.add('fade-out');
        setTimeout(() => {
          lyricEl.innerText = newText;
          currentLyric = newText;
          lyricEl.classList.remove('fade-out');
        }, 180);
      }
    }

    window.onload = () => {
      connectWebSocket();
    };
  </script>
</body>
</html>
